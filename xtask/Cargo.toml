[package]
name = "xtask"
edition.workspace = true
version.workspace = true

[dependencies]
sim-core = { path = "../sim-core", features = ["counters", "from-scratch", "house-level", "tick-number"] }
# The map generators. This is the one crate in the workspace allowed to name
# them: they are tools that write an asset, and `doc-check` refuses a `sim-*`
# crate that depends on either.
map-gen = { path = "../map-gen" }
map-gen2 = { path = "../map-gen2" }
sim-data = { path = "../sim-data" }
sim-replay = { path = "../sim-replay" }
# gen-map2's own front door: reading the RON file a list of sources comes in
# as. map-gen2 itself gains no serde/ron dependency — see gen_map2.rs.
serde = { workspace = true }
ron = { workspace = true }
# The seeded map's dice. The same generator the core seeds its own streams with,
# rather than a second one invented here — and it stays out of the core's way:
# what it decides is where the benchmark puts its roads, which happens before the
# first tick and never enters the simulation (D4).
rand = { workspace = true }
rand_pcg = { workspace = true }

[lints]
workspace = true
