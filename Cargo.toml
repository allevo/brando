[workspace]
resolver = "3"
members = ["map-gen", "sim-core", "sim-data", "sim-replay", "xtask"]

# Versions pinned here: the child crates use { workspace = true }.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
slotmap = { version = "1", features = ["serde"] }
rand = { version = "0.9", default-features = false }
rand_pcg = { version = "0.9", features = ["serde"] }
ron = "0.10"
blake3 = "1"
proptest = "1"
insta = "1"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Floats stay in the renderer (D4): they do not enter the state.
float_arithmetic = "deny"
