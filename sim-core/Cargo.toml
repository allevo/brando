[package]
name = "sim-core"
edition.workspace = true
version.workspace = true

# WARNING: this list does not grow without discussion (D1).
# sim-core is a pure Rust crate: no ECS, no Bevy, no I/O.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
slotmap = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
blake3 = { workspace = true }

# Direct-mutation hooks on the state, for other crates' tests (phase 08).
# Not an extension of the API: the only write channel into the core is still
# the Command queue.
[features]
test-util = []

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
