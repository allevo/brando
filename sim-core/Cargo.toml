[package]
name = "sim-core"
edition.workspace = true
version.workspace = true

# WARNING: this list does not grow without discussion (D1).
# sim-core is a pure Rust crate: no ECS, no Bevy, no I/O.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
slotmap = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
blake3 = { workspace = true }

[features]
counters = []
# The recomputation of coverage from scratch. It is its own feature, and not part
# of `test-util`, because one of the two readers outside the crate is `xtask`,
# which reaches it over a normal dependency edge — where `test-util` would compile
# the direct-mutation hooks on `World` into every plain workspace build.
from-scratch = []
test-util = ["counters", "from-scratch"]
# Founding a house at a level of your choosing, for setup that has to stand a
# city up as though it had already been played. Its own feature, and not part of
# `test-util`, for the same reason `from-scratch` is not.
house-level = []
# Tick::get(). Its own feature, not part of `test-util`, for the same reason
# `from-scratch` is: sim-replay and xtask read a tick's raw number over a normal
# dependency edge, where `test-util` would pull in far more than that.
tick-number = []

[dev-dependencies]
proptest = { workspace = true }
# A dependency on itself, which is how a crate turns one of its own features on
# for its own tests. `test-util` exists for the eviction tests of phase 13: decay
# sends away whoever no longer fits, and under a dataset that passes validation no
# house can ever be over its capacity — so the only honest way to reach that
# branch is to put the residents there by hand, which is what `house_mut` is for.
# Phase 14 makes the branch live and this dependency ordinary. `tick-number` is
# here so the integration tests can read a tick's raw number too.
sim-core = { path = ".", features = ["house-level", "test-util", "tick-number"] }

[lints]
workspace = true
