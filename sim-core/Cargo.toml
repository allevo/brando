[package]
name = "sim-core"
edition.workspace = true
version.workspace = true

# WARNING: this list does not grow without discussion (D1).
# sim-core is a pure Rust crate: no ECS, no Bevy, no I/O.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
slotmap = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
blake3 = { workspace = true }

[features]
# The diagnostic counters kept beside the derived structures — today the one on
# `Coverage`, which counts recomputations. Nothing in the tick reads them, so
# they are compiled only where something does: the tests, and `xtask bench`,
# which prints how many recomputations a run of empty ticks cost.
counters = []

# Hooks on the state, for tests — other crates' since phase 08, this crate's own
# since phase 13. Mostly direct mutation, and not an extension of the API: the
# only write channel into the core is still the Command queue. Since `World` stopped
# being `Clone` in any configuration, it also
# holds one **read-only** member, `first_difference`, which compares two worlds
# that played the same game — what the tests do instead of copying one, `World`
# being no longer Clone.
#
# It turns `counters` on, so no test asks for both: `first_difference` compares
# the counters along with everything else, and a test reading one already needs
# this feature for its setup. The two stay separate because only this one is
# confined to dev-dependency edges, where a plain workspace build cannot reach
# the mutation hooks; `counters` is read-only and may travel further.
test-util = ["counters"]

[dev-dependencies]
proptest = { workspace = true }
# A dependency on itself, which is how a crate turns one of its own features on
# for its own tests. It exists for the eviction tests of phase 13: decay sends
# away whoever no longer fits, and under a dataset that passes validation no
# house can ever be over its capacity — so the only honest way to reach that
# branch is to put the residents there by hand, which is what `house_mut` is for.
# Phase 14 makes the branch live and this dependency ordinary.
sim-core = { path = ".", features = ["test-util"] }

[lints]
workspace = true
