[package]
name = "sim-replay"
edition.workspace = true
version.workspace = true

[dependencies]
# tick-number: hash.rs, recording.rs and replay.rs all read a tick's raw number
# (to hash it, to compare it against the wire format, to stride checkpoints).
sim-core = { path = "../sim-core", features = ["tick-number"] }
sim-data = { path = "../sim-data" }
serde = { workspace = true }
thiserror = { workspace = true }
ron = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
# The test-util feature is only needed by the test that checks the hash's coverage.
sim-core = { path = "../sim-core", features = ["test-util"] }

[lints]
workspace = true
