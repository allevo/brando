# D4's prohibitions as linter errors, not as conventions.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "D4: non-deterministic iteration order, use BTreeMap or IndexMap" },
  { path = "std::collections::HashSet", reason = "D4: same" },
]
# `rand` is compiled with default-features = false: `rand::rng` and
# `rand::thread_rng` do not exist in the graph at all, and the entries below are
# the second line of defence for the day a feature brings them back in.
# `allow-invalid` keeps them quiet as long as the path does not exist.
disallowed-methods = [
  { path = "rand::rng", reason = "D4: the RNG lives in the state and is seeded", allow-invalid = true },
  { path = "rand::thread_rng", reason = "D4: same", allow-invalid = true },
  { path = "std::time::Instant::now", reason = "D4: no access to the clock in the core" },
  { path = "std::time::SystemTime::now", reason = "D4: same" },
]
